apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: standup-counter
  namespace: standup-counter
  annotations:
    # HTTPS only: the team ID in every URL is the access token, and the PR
    # publisher sends a bearer token, so neither may cross the network in clear
    # text. Redirect plain HTTP to HTTPS at the Traefik "web" entrypoint (e.g.
    # entryPoints.web.http.redirections) rather than serving the app on it.
    # Traefik proxies WebSockets natively; no extra annotation is needed.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: standup.example.com  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: standup-counter
                port:
                  number: 80
  tls:
    - hosts:
        - standup.example.com  # Change to your domain
      # Certificate secret (e.g. issued by cert-manager). If it doesn't exist,
      # Traefik falls back to its default certificate.
      secretName: standup-tls
