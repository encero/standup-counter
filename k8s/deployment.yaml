apiVersion: apps/v1
kind: Deployment
metadata:
  name: standup-counter
  namespace: standup-counter
  labels:
    app: standup-counter
spec:
  replicas: 1  # Keep at 1 due to SQLite
  selector:
    matchLabels:
      app: standup-counter
  template:
    metadata:
      labels:
        app: standup-counter
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: standup-counter
          image: standup-counter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/standup.db
            - name: NODE_ENV
              value: production
            # Requests arrive through the ingress (one proxy hop); trust its
            # X-Forwarded-For so rate limiting sees real client IPs.
            - name: TRUST_PROXY
              value: "1"
            # Local timezone for standup dates and sprint-day rollover.
            # Set to your team's zone (defaults to UTC if unset).
            # - name: TZ
            #   value: Europe/Prague
          # The image's entrypoint starts as root only to chown the data
          # directory (databases written by older root-running images, or copied
          # in from elsewhere, aren't owned by `node`), then drops to the
          # unprivileged `node` user via su-exec. This works on any volume type;
          # pod-level runAsUser + fsGroup does not, because hostPath volumes
          # (e.g. k3s local-path) ignore fsGroup. Only the capabilities that
          # step needs are kept.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID"]
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: standup-db-pvc
