apiVersion: apps/v1
kind: Deployment
metadata:
  name: standup-counter
  namespace: standup-counter
  labels:
    app: standup-counter
spec:
  replicas: 1  # Keep at 1 due to SQLite
  selector:
    matchLabels:
      app: standup-counter
  template:
    metadata:
      labels:
        app: standup-counter
    spec:
      # Run as the image's unprivileged `node` user. fsGroup makes the volume
      # group-writable for it, which also covers databases written by older
      # root-running images.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: standup-counter
          image: standup-counter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/standup.db
            - name: NODE_ENV
              value: production
            # Requests arrive through the ingress (one proxy hop); trust its
            # X-Forwarded-For so rate limiting sees real client IPs.
            - name: TRUST_PROXY
              value: "1"
            # Local timezone for standup dates and sprint-day rollover.
            # Set to your team's zone (defaults to UTC if unset).
            # - name: TZ
            #   value: Europe/Prague
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: standup-db-pvc
